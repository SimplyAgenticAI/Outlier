<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root {
    --emerald: #34d399;
    --emerald-bright: #6ee7b7;
    --text: #eafff3;
    --muted: #7fa693;
    --faint: #567a67;
    --ember: #e07a5f;
    --gold: #d9b45f;
    --border: rgba(110, 231, 183, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    width: 290px; margin: 0; padding: 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #08160f, #050b07);
    color: var(--text);
  }
  .head { display: flex; align-items: center; gap: 9px; margin-bottom: 15px; }
  .mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(140deg, #10301f, #06120c);
    border: 1px solid rgba(110,231,183,0.3);
    display: grid; place-items: center;
  }
  .mark svg { width: 17px; height: 17px; fill: var(--faint); }
  .mark .out { fill: var(--emerald-bright); }
  .name { font-weight: 700; font-size: 15px; }
  .name-suffix { font-weight: 500; font-size: 11px; color: #7fa693; margin-left: 2px; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat {
    padding: 11px 12px; border-radius: 10px;
    background: rgba(16,40,27,0.5); border: 1px solid var(--border);
  }
  .stat-val { font-size: 21px; font-weight: 750; color: var(--emerald-bright); }
  .stat-lab { font-size: 10.5px; color: var(--faint); margin-top: 1px; }

  .btn {
    width: 100%; padding: 10px; margin-bottom: 8px;
    border-radius: 9px; border: none; cursor: pointer;
    font-weight: 650; font-size: 13px;
    background: linear-gradient(135deg, #34d399, #10b981); color: #04150c;
  }
  .btn.stop { background: rgba(224,122,95,0.92); color: #fff; }
  .btn.ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); font-weight: 550;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; border-top: 1px solid var(--border); font-size: 12.5px;
  }
  .row-label { color: var(--muted); }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .dot.on { background: var(--emerald); box-shadow: 0 0 8px rgba(52,211,153,0.8); }
  .dot.off { background: var(--ember); }

  .switch { position: relative; width: 38px; height: 21px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; cursor: pointer; border-radius: 21px;
    background: rgba(110,231,183,0.14); transition: 0.2s;
  }
  .slider::before {
    content: ""; position: absolute; height: 15px; width: 15px; left: 3px; bottom: 3px;
    background: var(--muted); border-radius: 50%; transition: 0.2s;
  }
  input:checked + .slider { background: rgba(52,211,153,0.35); }
  input:checked + .slider::before { transform: translateX(17px); background: var(--emerald-bright); }

  input[type="text"] {
    width: 100%; padding: 8px 10px; margin-top: 5px;
    border-radius: 8px; border: 1px solid var(--border);
    background: rgba(6,20,13,0.6); color: var(--text); font-size: 12px;
  }
  .field-label { font-size: 11.5px; color: var(--muted); }

  .limit-block {
    padding: 11px 12px; margin-bottom: 10px; border-radius: 10px;
    background: rgba(16,40,27,0.4); border: 1px solid var(--border);
  }
  .limit-head { display: flex; justify-content: space-between; align-items: baseline; }
  .limit-val { font-size: 13px; font-weight: 700; color: var(--emerald-bright); }
  input[type="range"] {
    width: 100%; margin: 9px 0 4px; accent-color: var(--emerald);
    background: transparent;
  }
  .limit-hint { font-size: 11px; color: var(--faint); line-height: 1.5; }

  .msg { font-size: 11.5px; margin-top: 8px; min-height: 15px; color: var(--muted); }
  .msg.ok { color: var(--emerald-bright); }
  .msg.err { color: var(--ember); }
  .msg.warn { color: var(--gold); }

  .link {
    display: block; text-align: center; margin-top: 10px;
    color: var(--muted); font-size: 12px; text-decoration: none;
  }
  .link:hover { color: var(--emerald-bright); }
</style>
</head>
<body>

<div class="head">
  <span class="mark">
    <svg viewBox="0 0 24 24">
      <circle cx="5" cy="18" r="1.8"/><circle cx="9" cy="16" r="1.8"/>
      <circle cx="13" cy="17" r="1.8"/><circle cx="17" cy="15" r="1.8"/>
      <circle class="out" cx="19" cy="5" r="2.6"/>
    </svg>
  </span>
  <span class="name">Outlier <span class="name-suffix">for Facebook</span></span>
</div>

<div class="stats">
  <div class="stat">
    <div class="stat-val" id="captured">0</div>
    <div class="stat-lab">captured here</div>
  </div>
  <div class="stat">
    <div class="stat-val" id="total">0</div>
    <div class="stat-lab">total all-time</div>
  </div>
</div>

<button class="btn" id="start-btn">Start auto-scroll</button>
<button class="btn ghost" id="scan-btn">Scan visible posts</button>

<div class="limit-block">
  <div class="limit-head">
    <span class="row-label">Stop after</span>
    <span class="limit-val" id="limit-val">200 posts</span>
  </div>
  <input type="range" id="max-posts" min="50" max="500" step="25" value="200">
  <div class="limit-hint" id="limit-hint"></div>
</div>

<div class="row">
  <span class="row-label">Capturing</span>
  <label class="switch">
    <input type="checkbox" id="toggle" checked>
    <span class="slider"></span>
  </label>
</div>

<div class="row">
  <span class="row-label">Auto-update</span>
  <label class="switch">
    <input type="checkbox" id="auto-update" checked>
    <span class="slider"></span>
  </label>
</div>

<div class="row">
  <span class="row-label">Dashboard</span>
  <span class="status"><span class="dot" id="dot"></span><span id="status-text">checking…</span></span>
</div>

<div class="row">
  <span class="row-label">Extension</span>
  <span class="status"><span id="ext-version">—</span></span>
</div>

<div style="margin-top:10px">
  <span class="field-label">Account key</span>
  <input type="password" id="api-key" placeholder="olk_… from the Account page">
</div>

<div style="margin-top:10px">
  <span class="field-label">Dashboard URL</span>
  <input type="text" id="endpoint" placeholder="http://localhost:5050">
</div>

<button class="btn ghost" id="save-endpoint" style="margin-top:8px">Save &amp; test</button>
<div class="msg" id="msg"></div>

<a class="link" id="open-dashboard" href="#" target="_blank">Open dashboard →</a>

<script src="popup.js"></script>
</body>
</html>
