<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Outlier{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/outlier.css') }}">
</head>
<body>

<div class="ambient"></div>

<header class="topbar">
  <a class="brand" href="{{ url_for('feed') }}">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="5" cy="18" r="1.8"/><circle cx="9" cy="16" r="1.8"/>
        <circle cx="13" cy="17" r="1.8"/><circle cx="17" cy="15" r="1.8"/>
        <circle class="mark-outlier" cx="19" cy="5" r="2.6"/>
      </svg>
    </span>
    <span class="brand-name">Outlier</span>
  </a>

  <nav class="topnav">
    <a href="{{ url_for('feed') }}" class="{{ 'active' if active == 'feed' }}">Feed</a>
    <a href="{{ url_for('groups') }}" class="{{ 'active' if active == 'groups' }}">Groups</a>
    <a href="{{ url_for('library') }}" class="{{ 'active' if active == 'library' }}">Library</a>
    <a href="{{ url_for('capture') }}" class="{{ 'active' if active == 'capture' }}">Capture</a>
  </nav>

  <div class="topbar-right">
    <a class="btn btn-ghost" href="{{ url_for('capture') }}">Get the extension</a>
    <span class="version-pill">v{{ version }}</span>
  </div>
</header>

<main class="page">
  {% block content %}{% endblock %}
</main>

<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='js/outlier.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
