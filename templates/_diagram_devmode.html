        fill="rgba(255,255,255,0.03)" stroke="rgba(110,231,183,0.16)"/>

        fill="rgba(255,255,255,0.04)"/>

  <text x="272" y="23" class="dg-label">Developer mode</text>
  <rect class="dg-toggle" x="360" y="12" width="34" height="15" rx="7.5"/>
  <circle class="dg-knob" cx="386" cy="19.5" r="5.5"/>
  <circle class="dg-ping" cx="377" cy="19.5" r="21"/>

  <rect x="16" y="50" width="96" height="24" rx="5"
        fill="rgba(110,231,183,0.09)" stroke="rgba(110,231,183,0.28)"/>
