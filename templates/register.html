<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — {{ app_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/outlier.css') }}">
</head>
<body class="auth-body">

<div class="ambient"></div>
<canvas id="field" class="field" aria-hidden="true"></canvas>

<main class="auth-shell">
  <div class="glass auth-card">
    <div class="auth-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="18" r="1.8"/><circle cx="9" cy="16" r="1.8"/>
          <circle cx="13" cy="17" r="1.8"/><circle cx="17" cy="15" r="1.8"/>
          <circle class="mark-outlier" cx="19" cy="5" r="2.6"/>
        </svg>
      </span>
      <span class="brand-text"><span class="brand-name">{{ app_name }}</span><span class="brand-parent">{{ app_parent }}</span></span>
    </div>

    <h1>Create your account</h1>
    <p class="auth-sub">Free to start — one group, no card needed.</p>

    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}

    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>
        <span>Email</span>
        <input type="email" name="email" autocomplete="email" required autofocus>
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" autocomplete="new-password"
               minlength="{{ min_length }}" required>
        <small>At least {{ min_length }} characters. A passphrase beats a short complex one.</small>
      </label>
      <label>
        <span>Confirm password</span>
        <input type="password" name="password_confirm" autocomplete="new-password"
               minlength="{{ min_length }}" required>
      </label>
      <button class="btn btn-primary auth-submit" type="submit">Create account</button>
    </form>

    <p class="auth-alt">
      Already have one? <a href="{{ url_for('login') }}">Sign in</a>
    </p>
  </div>
</main>

<script src="{{ url_for('static', filename='js/field.js') }}"></script>
</body>
</html>
