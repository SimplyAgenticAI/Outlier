{# Dragging the folder from the file manager onto the extensions page. #}
<svg class="diagram" viewBox="0 0 420 132" role="img"
     aria-label="Dragging the extension folder from the file manager onto the Chrome extensions page">
  <rect x="1" y="20" width="150" height="94" rx="7"
        fill="rgba(255,255,255,0.03)" stroke="rgba(110,231,183,0.14)"/>
  <text x="14" y="38" class="dg-muted sm">File Explorer</text>
  <g class="dg-folder">
    <path d="M20 54 h20 l6 7 h30 a4 4 0 0 1 4 4 v26 a4 4 0 0 1 -4 4 h-56
             a4 4 0 0 1 -4 -4 v-33 a4 4 0 0 1 4 -4 z"
          fill="rgba(52,211,153,0.22)" stroke="rgba(110,231,183,0.6)"/>
    <text x="26" y="106" class="dg-text sm">extension</text>
  </g>

  <path class="dg-arrow" d="M120 74 C 180 74, 200 66, 246 66"
        fill="none" stroke="rgba(110,231,183,0.55)" stroke-width="1.6"
        stroke-dasharray="4 4" marker-end="url(#ah)"/>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="6" refY="4"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="rgba(110,231,183,0.75)"/>
    </marker>
  </defs>

  <rect x="256" y="20" width="163" height="94" rx="7"
        fill="rgba(52,211,153,0.05)" stroke="rgba(110,231,183,0.32)"
        stroke-dasharray="5 4"/>
  <text x="270" y="38" class="dg-muted sm">chrome://extensions</text>
  <text x="270" y="72" class="dg-text sm">Drop it</text>
  <text x="270" y="88" class="dg-muted sm">anywhere here</text>
</svg>
